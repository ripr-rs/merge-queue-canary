name: RIPR isolated waiting request
'on':
  pull_request_target:
    types: [auto_merge_enabled]
    branches: [main]
permissions: {}

jobs:
  observe:
    name: RIPR Pilot Waiting Request Observation
    if: ${{ github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PILOT_REPOSITORY: ripr-rs/merge-queue-canary
      PILOT_REPOSITORY_ID: '1465340557'
      PILOT_BASE: main
      PILOT_PR: '1'
      PILOT_HEAD: c731baad5fd10f26c9eb0023c39177ffa38099d0
      PILOT_OPERATOR_ID: '15812269'
    steps:
      - name: Observe the exact waiting request
        shell: bash
        run: |
          /usr/bin/python3 -I - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          from pathlib import Path

          def refuse(reason):
              sys.exit("Observation refused: " + reason)

          def number(key):
              value = os.environ.get(key, "")
              if not re.fullmatch(r"[1-9][0-9]{0,18}", value):
                  refuse("fixture identity is unset")
              return int(value)

          repo = os.environ.get("PILOT_REPOSITORY", "")
          repo_id = number("PILOT_REPOSITORY_ID")
          pr = number("PILOT_PR")
          operator = number("PILOT_OPERATOR_ID")
          base = os.environ.get("PILOT_BASE", "")
          head = os.environ.get("PILOT_HEAD", "")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              refuse("fixture repository is unset")
          if not re.fullmatch(r"[0-9a-f]{40}", head) or not base:
              refuse("fixture head or base is unset")

          def child(value, *keys):
              for key in keys:
                  value = value.get(key) if isinstance(value, dict) else None
              return value

          def same_pull(pull):
              return (
                  child(pull, "number") == pr
                  and child(pull, "draft") is False
                  and child(pull, "state") == "open"
                  and child(pull, "base", "repo", "id") == repo_id
                  and child(pull, "base", "ref") == base
                  and child(pull, "head", "repo", "id") == repo_id
                  and child(pull, "head", "sha") == head
              )

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if (os.environ.get("GITHUB_EVENT_NAME") != "pull_request_target"
                  or os.environ.get("GITHUB_RUN_ATTEMPT") != "1"
                  or child(event, "action") != "auto_merge_enabled"
                  or child(event, "repository", "id") != repo_id
                  or child(event, "number") != pr
                  or child(event, "sender", "id") != operator
                  or not same_pull(child(event, "pull_request"))):
              refuse("event does not select the authorized exact head")

          def waiting(pull):
              request = child(pull, "auto_merge")
              when = child(request, "enabled_at")
              if (not same_pull(pull) or child(request, "enabled_by", "id") != operator
                      or not isinstance(when, str)
                      or not re.fullmatch(r"\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ", when)):
                  refuse("exact head has no matching waiting request")
              return when

          selected_at = waiting(event["pull_request"])

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          root = "https://api.github.com/repos/" + repo

          def read(path):
              request = urllib.request.Request(root + path, method="GET", headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ripr-isolated-waiting-request",
              })
              with opener.open(request, timeout=8) as response:
                  if response.status != 200 or response.headers.get("Link"):
                      refuse("readback is unavailable or paginated")
                  data = response.read(1_048_577)
                  if len(data) > 1_048_576:
                      refuse("readback is too large")
                  return json.loads(data)

          def check_current():
              if waiting(read(f"/pulls/{pr}")) != selected_at:
                  refuse("waiting request was replaced")
              rows = read(f"/issues/{pr}/timeline?per_page=100")
              if (not isinstance(rows, list) or len(rows) >= 100
                      or not all(isinstance(row, dict) for row in rows)):
                  refuse("timeline is incomplete")
              transitions = [row for row in rows if row.get("event") in {
                  "auto_merge_enabled", "auto_merge_disabled", "auto_squash_enabled",
                  "auto_rebase_enabled", "added_to_merge_queue", "removed_from_merge_queue",
              }]
              if not all(isinstance(row.get("created_at"), str) for row in transitions):
                  refuse("timeline transition has no creation time")
              current = [row for row in transitions if row["created_at"] >= selected_at]
              if (len(current) != 1 or current[0].get("event") != "auto_merge_enabled"
                      or current[0]["created_at"] != selected_at
                      or child(current[0], "actor", "id") != operator
                      or type(current[0].get("id")) is not int):
                  refuse("selection timeline is missing, replaced, queued, or ambiguous")
              return current[0]["id"]

          first = check_current()
          if check_current() != first:
              refuse("waiting request changed during observation")
          print(f"Observed waiting request on exact H {head}, PR {pr}, timeline event {first}")
          PY
